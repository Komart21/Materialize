<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        <title>Example with Sidenav</title>

        <!-- Materialize CSS -->
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <link href="css/materialize.css" type="text/css" rel="stylesheet" media="screen,projection"/>
        <link href="css/index.css" type="text/css" rel="stylesheet" media="screen,projection"/>
    </head>
    <body>
        <!-- Header with Navbar for mobile (Sidenav trigger) -->
        <header>
            <nav>
                <div class="nav-wrapper">
                    <a href="#" data-target="slide-out" class="sidenav-trigger"><i class="material-icons">menu</i></a>
                </div>
            </nav>
        </header>

        <!-- Sidenav (menú lateral) -->
        <ul id="slide-out" class="sidenav">
            <li><a href="#!"><i class="material-icons">home</i>Inicio</a></li>
            <li><a href="#!"><i class="material-icons">cloud</i>Servicios</a></li>
            <li><a href="#!"><i class="material-icons">info</i>Acerca de</a></li>
            <li><a href="#!"><i class="material-icons">contact_mail</i>Contacto</a></li>
        </ul>

        <!-- Tabs -->
        <ul id="tabs-swipe-demo" class="tabs">
            <li class="tab col s3"><a href="#test-swipe-1">Test 1</a></li>
            <li class="tab col s3"><a class="active" href="#test-swipe-2">Test 2</a></li>
            <li class="tab col s3"><a href="#test-swipe-3">Test 3</a></li>
        </ul>

        <div id="test-swipe-1" class="col s12 blue">Test 1</div>

        <div id="test-swipe-2" class="col s12" style="background-color: #f0f8ff;"> <!-- Fondo cambiado -->
            <!-- Buscador de Pokémon -->
            <h4>Buscar Pokémon</h4>
            <label for="pokemon-name">Introduce el nombre o número del Pokémon:</label>
            <input type="text" id="pokemon-name" placeholder="Ej. pikachu, 25">
            <button id="search-pokemon" class="btn waves-effect waves-light">Buscar Pokémon</button>
            
            <!-- Resultado de la búsqueda -->
            <div id="pokemon-result" style="margin-top: 20px;"></div>

            <!-- Collection List para los Pokemons -->
            <div class="collection" id="pokemon-list">
                <a href="#!" class="collection-item">Pokemons</a>
            </div>
        </div>

        <div id="test-swipe-3" class="col s12 green">Test 3</div>

        <!-- JavaScript -->
        <script src="js/jquery-3.7.1.js"></script>
        <script src="js/materialize.js"></script>
        <script src="js/index.js"></script>
    </body>
</html>
